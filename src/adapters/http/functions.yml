createVisit:
  handler: src/adapters/http/createVisit/createVisit.handler
  events:
    - http:
        path: visits
        method: post
        authorizer:
          name: UserPoolAuthorizer
          type: COGNITO_USER_POOLS
          arn: !GetAtt CognitoUserPool.Arn
        request:
          schemas:
            application/json:
              schema: ${file(src/adapters/http/createVisit/schema.json)}
              name: createVisitBody
  environment:
    VISITS_EVENT_STORE_TABLE: !Ref VisitEventStoreTable
    ATTENDEE_TABLE: !Ref AttendeeTable
    ROOM_TABLE: !Ref RoomTable
    ROOM_RESERVATION_TABLE: !Ref RoomReservationTable
    ADMINS_GROUP_NAME: !Ref AdminsGroup
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
      Resource: !GetAtt VisitEventStoreTable.Arn
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
      Resource: !GetAtt AttendeeTable.Arn
    - Effect: Allow
      Action:
        - dynamodb:GetItem
      Resource: !GetAtt RoomTable.Arn
    - Effect: Allow
      Action: dynamodb:Query
      Resource: !Sub ${RoomReservationTable.Arn}/index/byBaseDateRoomIdAndDateStart
changeVisitTimeframe:
  handler: src/adapters/http/changeVisitTimeframe/changeVisitTimeframe.handler
  environment:
    ADMINS_GROUP_NAME: !Ref AdminsGroup
    VISITS_EVENT_STORE_TABLE: !Ref VisitEventStoreTable
    VISIT_TABLE: !Ref VisitTable
  iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:GetItem
      Resource: !GetAtt VisitTable.Arn
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:PutItem
      Resource: !GetAtt VisitEventStoreTable.Arn
  events:
    - http:
        path: visits/{id}/change-timeframe
        method: put
        authorizer:
          name: UserPoolAuthorizer
          type: COGNITO_USER_POOLS
          arn: !GetAtt CognitoUserPool.Arn
        request:
          parameters:
            paths:
              id: true
          schemas:
            application/json:
              schema: ${file(src/adapters/http/changeVisitTimeframe/schema.json)}
              name: changeVisitTimeframeBody

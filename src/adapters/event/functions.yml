onVisitStream:
  handler: src/adapters/event/onVisitStream/onVisitStream.handler
  destinations:
    onFailure:
      type: sqs
      arn: !GetAtt OnVisitStreamDLQ.Arn
  environment:
    EVENT_BUS: !Ref EventBus
  iamRoleStatements:
    - Effect: Allow
      Action: events:PutEvents
      Resource: !GetAtt EventBus.Arn
    - Effect: Allow
      Action: sqs:SendMessage
      Resource: !GetAtt OnVisitStreamDLQ.Arn
  events:
    - stream:
        type: dynamodb
        arn: !GetAtt VisitEventStoreTable.StreamArn
onVisitCreated:
  handler: src/adapters/event/onVisitCreated/onVisitCreated.handler
  destinations:
    onFailure:
      type: sqs
      arn: !GetAtt OnVisitCreatedDLQ.Arn
  environment:
    VISIT_TABLE: !Ref VisitTable
    ATTENDEE_TABLE: !Ref AttendeeTable
    ROOM_TABLE: !Ref RoomTable
    ROOM_RESERVATION_TABLE: !Ref RoomReservationTable
  iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:GetItem
      Resource: !GetAtt AttendeeTable.Arn
    - Effect: Allow
      Action: dynamodb:PutItem
      Resource: !GetAtt VisitTable.Arn
    - Effect: Allow
      Action: dynamodb:GetItem
      Resource: !GetAtt RoomTable.Arn
    - Effect: Allow
      Action: dynamodb:PutItem
      Resource: !GetAtt RoomReservationTable.Arn
    - Effect: Allow
      Action: sqs:SendMessage
      Resource: !GetAtt OnVisitCreatedDLQ.Arn
  events:
    - eventBridge:
        eventBus: !Ref EventBus
        pattern:
          detail-type:
            - VISIT_CREATED
        deadLetterQueueArn: !GetAtt OnVisitCreatedDLQ.Arn
